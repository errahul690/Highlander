<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>NEUFC</title>
<style>
  :root { color-scheme: light; background: #fff; color: #121212; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .splash { position: relative; width: 100%; height: 100%; height: 100dvh; isolation: isolate; background: #fff; }
  .crest { position: absolute; left: 50%; top: 50%; width: clamp(160px, 52vw, 224px); max-width: 48vh; height: auto; transform: translate(-50%, -50%); animation: arrive .65s ease-out both; }
  .signature { position: absolute; left: 24px; right: 24px; bottom: max(68px, calc(env(safe-area-inset-bottom) + 44px)); text-align: center; animation: signature .7s .15s ease-out both; }
  .name { margin: 0; padding-left: .22em; font-size: 25px; font-weight: 800; letter-spacing: .22em; line-height: 1.2; }
  .caption { margin: 10px 0 0; font-size: 9px; font-weight: 600; letter-spacing: .25em; color: #777; }
  .rule { display: block; width: 24px; height: 3px; margin: 18px auto 0; background: #f00; border-radius: 2px; }
  .ribbon { position: absolute; bottom: 0; left: 0; width: 100%; height: 16px; background: #f00; clip-path: polygon(0 65%, 100% 0, 100% 100%, 0 100%); }
  .ribbon::after { content: ""; position: absolute; inset: 0; background: #a30000; clip-path: polygon(0 85%, 100% 55%, 100% 100%, 0 100%); }
  @keyframes arrive { from { opacity: .2; transform: translate(-50%, -50%) scale(.96); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  @keyframes signature { from { opacity: 0; } to { opacity: 1; } }
  @media (max-height: 450px) { .crest { max-width: 42vh; top: 43%; } .signature { bottom: 30px; } .name { font-size: 18px; } .caption { margin-top: 5px; font-size: 8px; } .rule { margin-top: 9px; height: 2px; } }
  @media (prefers-reduced-motion: reduce) { .crest, .signature { animation: none; } }
</style>
</head>
<body>
<main class="splash" aria-label="NEUFC, NorthEast United Football Club">
  <img class="crest" src="data:image/png;base64,{{LOGO_BASE64}}" width="512" height="512" alt="NorthEast United FC crest">
  <footer class="signature">
    <h1 class="name">NEUFC</h1>
    <p class="caption">OFFICIAL CLUB APP</p>
    <span class="rule" aria-hidden="true"></span>
  </footer>
  <div class="ribbon" aria-hidden="true"></div>
</main>
</body>
</html>
