<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Highlanders Climb Splash</title>
<style>
/* Layout: one phone-sized splash; full-bleed on phones. Single light look by design (the paper artwork). */
:root {
  --page: #0e1014;
  --paper: #efefee;
  --red: #e3141b;
  --ink: #16171a;
  --track: rgba(20, 20, 24, .12);
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--page); margin: 0; overflow: hidden; }
.shell { height: 100%; display: grid; place-items: center; padding-inline: 16px; padding-block: 16px; box-sizing: border-box; }
.phone { position: relative; width: min(390px, 100%); aspect-ratio: 800 / 1700; max-height: calc(100vh - 32px); border-radius: 46px; overflow: hidden; background: var(--paper); box-shadow: 0 0 0 9px #16181d, 0 0 0 10px #2b2e36, 0 40px 90px rgba(0,0,0,.6); cursor: pointer; -webkit-tap-highlight-color: transparent; outline: none; }
.phone:focus-visible { box-shadow: 0 0 0 9px #16181d, 0 0 0 12px #e3141b, 0 40px 90px rgba(0,0,0,.6); }
@media (max-width: 480px) {
  .shell { padding: 0; }
  .phone { width: 100vw; height: 100vh; height: 100dvh; max-height: none; aspect-ratio: auto; border-radius: 0; box-shadow: none; }
}
.stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); overflow: hidden; }
.L { position: absolute; display: block; pointer-events: none; }
.L > img, img.L { width: 100%; height: 100%; display: block; }

/* world */
.contour { opacity: .95; }
.mtns { position: absolute; inset: 0; transform-origin: 50% 80%; opacity: 0; }
.play .mtns { animation: rise 2.2s cubic-bezier(.16,1,.3,1) .25s both, drift 16s ease-in-out 2.5s infinite; }
@keyframes rise { from { opacity: 0; transform: translateY(9%) scale(1.06); } to { opacity: 1; transform: none; } }
@keyframes drift { 0%,100% { transform: none; } 50% { transform: translateY(-.5%) scale(1.015); } }
.mtnimg { -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 9%); mask-image: linear-gradient(to bottom, transparent 0, #000 9%); }
canvas.full { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }

.summit { width: 9%; aspect-ratio: 1; transform: translate(-50%, -50%) scale(0); opacity: 0; }
.summit.on { animation: glint 1.4s cubic-bezier(.2,.9,.3,1) forwards; }
.summit::before { content: ""; position: absolute; inset: 0; background: conic-gradient(from 0deg, transparent 0 20deg, rgba(227,20,27,.9) 22deg 24deg, transparent 26deg 65deg, rgba(227,20,27,.9) 67deg 69deg, transparent 71deg 110deg, rgba(227,20,27,.9) 112deg 114deg, transparent 116deg 155deg, rgba(227,20,27,.9) 157deg 159deg, transparent 161deg 200deg, rgba(227,20,27,.9) 202deg 204deg, transparent 206deg 245deg, rgba(227,20,27,.9) 247deg 249deg, transparent 251deg 290deg, rgba(227,20,27,.9) 292deg 294deg, transparent 296deg 335deg, rgba(227,20,27,.9) 337deg 339deg, transparent 341deg); -webkit-mask-image: radial-gradient(circle, transparent 18%, #000 30%, transparent 70%); mask-image: radial-gradient(circle, transparent 18%, #000 30%, transparent 70%); }
.summit::after { content: ""; position: absolute; inset: 32%; border-radius: 50%; background: radial-gradient(circle, #fff 0 20%, rgba(227,20,27,.9) 40%, rgba(227,20,27,0) 72%); }
@keyframes glint { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.2) rotate(0deg); } 25% { opacity: 1; transform: translate(-50%,-50%) scale(1.2) rotate(30deg); } 100% { opacity: 0; transform: translate(-50%,-50%) scale(2) rotate(70deg); } }
.ring { width: 4%; aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--red); transform: translate(-50%,-50%) scale(.3); opacity: 0; }
.ring.on { animation: ring 1.6s cubic-bezier(.2,.7,.3,1) forwards; }
@keyframes ring { 0% { opacity: .9; transform: translate(-50%,-50%) scale(.3); } 100% { opacity: 0; transform: translate(-50%,-50%) scale(5); } }

/* lockup */
.crest { opacity: 0; }
.play .crest { animation: crestIn 1.1s cubic-bezier(.2,1.25,.35,1) .5s both, float 6s ease-in-out 2.2s infinite; }
@keyframes crestIn { 0% { opacity: 0; transform: scale(.55) translateY(8%); filter: blur(14px); } 60% { opacity: 1; filter: blur(0); } 100% { opacity: 1; transform: none; filter: none; } }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.1%); } }
.star { opacity: 0; }
.play .star { animation: starPop .55s cubic-bezier(.2,1.6,.4,1) both; animation-delay: var(--d); }
@keyframes starPop { 0% { opacity: 0; transform: scale(0) rotate(-140deg); } 60% { opacity: 1; transform: scale(1.5) rotate(12deg); } 100% { opacity: 1; transform: none; } }
.star.twinkle { animation: twinkle .7s ease-out !important; opacity: 1; }
@keyframes twinkle { 0% { transform: scale(1); filter: none; } 40% { transform: scale(1.45) rotate(18deg); filter: drop-shadow(0 0 6px rgba(227,20,27,.9)); } 100% { transform: scale(1); filter: none; } }
.shine { background: linear-gradient(105deg, transparent 0 40%, rgba(255,255,255,.6) 50%, transparent 60% 100%) no-repeat; background-size: 280% 100%; background-position: 140% 0; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
.play .shine { animation: shine 6.5s ease-in-out infinite; animation-delay: var(--d); }
@keyframes shine { 0% { background-position: 140% 0; } 20%, 100% { background-position: -40% 0; } }
.the { opacity: 0; }
.play .the { animation: dropIn .7s cubic-bezier(.2,1,.3,1) 1.2s both; }
@keyframes dropIn { from { opacity: 0; transform: translateY(-45%); } to { opacity: 1; transform: none; } }
.hl { clip-path: inset(0 100% 0 0); }
.play .hl { animation: wipe .85s cubic-bezier(.7,0,.2,1) 1.4s both, punch .6s cubic-bezier(.2,1.4,.4,1) 2s both; }
@keyframes wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 -2% 0 -2%); } }
@keyframes punch { 0% { transform: scale(1); } 40% { transform: scale(1.035); } 100% { transform: scale(1); } }
.hlbar { background: var(--red); transform: scaleX(0); }
.play .hlbar { animation: slash .85s cubic-bezier(.7,0,.2,1) 1.4s both; }
@keyframes slash { 0% { transform: scaleX(0); transform-origin: left; } 50% { transform: scaleX(1); transform-origin: left; } 51% { transform-origin: right; } 100% { transform: scaleX(0); transform-origin: right; } }
.tag { opacity: 0; clip-path: inset(0 50% 0 50%); }
.play .tag { animation: tagIn 1s cubic-bezier(.2,1,.3,1) 1.95s both; }
@keyframes tagIn { from { opacity: 0; clip-path: inset(0 50% 0 50%); transform: scaleX(1.12); } to { opacity: 1; clip-path: inset(0 -2% 0 -2%); transform: none; } }
.bar { border-radius: 99px; background: var(--track); opacity: 0; }
.play .bar { animation: fadeIn .5s ease 1.2s forwards; }
@keyframes fadeIn { to { opacity: 1; } }
.fill { position: absolute; left: 0; top: 0; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #b30e14, var(--red)); }
.fill::after { content: ""; position: absolute; right: -4px; top: 50%; width: 12px; height: 12px; transform: translateY(-50%); border-radius: 50%; background: radial-gradient(circle, #fff 0 22%, rgba(227,20,27,.9) 40%, rgba(227,20,27,0) 70%); }

.curtain { position: absolute; inset: 0; background: var(--paper); pointer-events: none; }
.play .curtain { animation: curtain .6s ease .05s forwards; }
@keyframes curtain { to { opacity: 0; } }
.hint { position: absolute; left: 0; right: 0; bottom: 2.4%; text-align: center; font: 700 11px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .14em; color: rgba(255,255,255,.92); text-shadow: 0 1px 4px rgba(120,0,0,.6); opacity: 0; transition: opacity .6s; pointer-events: none; }
.done .hint { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  .play .mtns, .play .crest, .play .star, .play .the, .play .hl, .play .tag, .play .shine, .play .hlbar { animation: none !important; }
  .mtns, .crest, .star, .the, .tag { opacity: 1; } .hl, .tag { clip-path: none; }
}
</style>

const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

// position layers from artwork pixels (800 x 1700)
document.querySelectorAll("[style*='--x']").forEach(el => {
  const cs = getComputedStyle(el), g = n => parseFloat(cs.getPropertyValue(n));
  el.style.left = g("--x") / 8 + "%"; el.style.top = g("--y") / 17 + "%";
  el.style.width = g("--w") / 8 + "%"; el.style.height = g("--h") / 17 + "%";
});
document.querySelectorAll(".shine").forEach(el => { const u = `url(${el.parentElement.querySelector("img").src})`; el.style.webkitMaskImage = u; el.style.maskImage = u; });
const top = PTS[100];
for (const el of [summit, ring]) { el.style.left = top[0] * 100 + "%"; el.style.top = top[1] * 100 + "%"; }

// stage covers the phone at the artwork's aspect
let SW = 0, SH = 0, dpr = 1;
function size() {
  const w = phone.clientWidth, h = phone.clientHeight, a = 800 / 1700;
  if (w / h > a) { SW = w; SH = w / a; } else { SH = h; SW = h * a; }
  stage.style.width = SW + "px"; stage.style.height = SH + "px";
  dpr = Math.min(2, devicePixelRatio || 1);
  fx.width = fogCv.width = Math.round(SW * dpr); fx.height = fogCv.height = Math.round(SH * dpr);
  roadCv.width = Math.round(SW * 782 / 800 * dpr); roadCv.height = Math.round(SH * 660 / 1700 * dpr);
  if (gl) gl.viewport(0, 0, roadCv.width, roadCv.height);
}

// ---------- WebGL road: paints along its own length, with a wet leading edge and a travelling sheen
let gl = null, uT, uSheen;
function initGL(roadImg, distImg) {
  gl = roadCv.getContext("webgl", { premultipliedAlpha: true, alpha: true, antialias: false });
  if (!gl) return false;
  const vs = `attribute vec2 p; varying vec2 uv; void main(){ uv = vec2(p.x*.5+.5, .5-p.y*.5); gl_Position = vec4(p,0.,1.); }`;
  const fs = `precision mediump float; varying vec2 uv; uniform sampler2D road, dist; uniform float T, S;
    void main(){
      vec4 c = texture2D(road, uv); vec4 e = texture2D(dist, uv);
      float d = (e.r*65280.0 + e.g*255.0)/65535.0;
      float a = e.b * (1.0 - smoothstep(T-0.018, T, d));
      float head = exp(-pow((T-d)/0.012, 2.0)) * step(d, T);
      float sheen = exp(-pow((d - S)/0.035, 2.0));
      vec3 col = mix(c.rgb, vec3(1.0, 0.42, 0.40), 0.5*head) + vec3(0.22,0.12,0.12)*sheen;
      gl_FragColor = vec4(col*a, a);
    }`;
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(o); return o; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr); gl.useProgram(pr);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const tex = (img, unit, filter) => { const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false); gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); };
  tex(roadImg, 0, gl.LINEAR); tex(distImg, 1, gl.NEAREST);
  gl.uniform1i(gl.getUniformLocation(pr, "road"), 0); gl.uniform1i(gl.getUniformLocation(pr, "dist"), 1);
  uT = gl.getUniformLocation(pr, "T"); uSheen = gl.getUniformLocation(pr, "S");
  gl.clearColor(0, 0, 0, 0);
  return true;
}
function drawRoad(T, S) {
  if (!gl) return;
  gl.viewport(0, 0, roadCv.width, roadCv.height);
  gl.clear(gl.COLOR_BUFFER_BIT); gl.uniform1f(uT, T); gl.uniform1f(uSheen, S); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// ---------- fog, snow, ink
const puff = document.createElement("canvas"); puff.width = 320; puff.height = 120;
(() => { const p = puff.getContext("2d"); for (let i = 0; i < 55; i++) { const x = rnd(40, 280), y = rnd(46, 76), r = rnd(16, 44); const g = p.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, "rgba(255,255,255,.30)"); g.addColorStop(1, "rgba(255,255,255,0)"); p.fillStyle = g; p.beginPath(); p.arc(x, y, r, 0, 7); p.fill(); } })();
// ambient banks: [x, y, width, speed, alpha]
const BANKS = [[-0.1, .66, .7, .010, .55], [.45, .72, .8, -.008, .5], [.1, .80, .9, .007, .6], [.6, .86, .8, -.012, .55], [-.2, .93, 1.0, .009, .6], [.7, .60, .5, .006, .35]];
// intro veil: heavy mist that parts to reveal the range
const VEIL = Array.from({ length: 10 }, (_, i) => ({ x: rnd(-.3, .8), y: rnd(.55, 1.0), w: rnd(.7, 1.1), dir: i % 2 ? 1 : -1 }));
const snow = Array.from({ length: 70 }, () => ({ x: rnd(0, 1), y: rnd(0, 1), r: rnd(.5, 1.6), v: rnd(.012, .03), p: rnd(0, 6.28) }));
const ink = [];

let t0 = 0, last = 0, glinted = false, done = false;
const ROAD_START = 1.25, ROAD_DUR = 3.0;
function tick(now) {
  if (!t0) t0 = last = now;
  const t = (now - t0) / 1000, dt = Math.min(.05, (now - last) / 1000); last = now;

  // road progress drives the loader: every fan is climbing
  const pr = reduce ? 1 : clamp((t - ROAD_START) / ROAD_DUR, 0, 1);
  const T = reduce ? 1.02 : easeInOut(pr) * 1.04 - 0.02;
  const S = (t - ROAD_START - ROAD_DUR) > 0 ? ((t - ROAD_START - ROAD_DUR) / 3.2) % 1 * 1.3 - .15 : -1;
  drawRoad(T, S);
  fill.style.width = clamp(T, 0, 1) * 100 + "%";
  if (!glinted && T >= 1) {
    glinted = true;
    summit.classList.add("on"); ring.classList.add("on");
    stars.forEach((s, i) => setTimeout(() => { s.classList.remove("twinkle"); void s.offsetWidth; s.classList.add("twinkle"); }, 250 + Math.abs(i - 3) * 70));
    setTimeout(() => { done = true; phone.classList.add("done"); }, 1400);
  }

  // contour lines draw in from the top
  const cp = reduce ? 1 : clamp((t - .1) / 1.6, 0, 1);
  const edge = cp * 125 - 15;
  const m = `linear-gradient(to bottom, #000 ${edge}%, transparent ${edge + 15}%)`;
  contour.style.webkitMaskImage = m; contour.style.maskImage = m;
  contour.style.transform = reduce ? "" : `translateX(${Math.sin(t * .35) * .5}%)`;

  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, SW, SH);

  // ambient fog
  const fogIn = reduce ? 1 : clamp((t - .4) / 2, 0, 1);
  for (const b of BANKS) {
    const x = ((b[0] + b[3] * t + 1.2) % 2.2) - .7;
    fctx.globalAlpha = b[4] * fogIn;
    fctx.drawImage(puff, x * SW, b[1] * SH - b[2] * SW * .19, b[2] * SW, b[2] * SW * .375);
  }
  // intro veil parting
  if (!reduce && t < 3.2) {
    const k = clamp((t - .5) / 2.2, 0, 1), e = 1 - Math.pow(1 - k, 3);
    for (const v of VEIL) {
      fctx.globalAlpha = (1 - e) * .95;
      fctx.drawImage(puff, (v.x + v.dir * e * .8) * SW, v.y * SH - v.w * SW * .2, v.w * SW * 1.4, v.w * SW * .5);
    }
  }
  fctx.globalAlpha = 1;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, SW, SH);

  // light snow over the range
  if (!reduce) {
    for (const s of snow) {
      s.y += s.v * dt; s.p += dt; if (s.y > 1) { s.y = .5; s.x = rnd(0, 1); }
      if (s.y < .55) continue;
      const a = Math.min(1, (s.y - .55) / .06) * .45;
      ctx.fillStyle = `rgba(120,124,134,${a})`;
      ctx.beginPath(); ctx.arc((s.x + Math.sin(s.p) * .006) * SW, s.y * SH, s.r * SW / 500, 0, 7); ctx.fill();
    }
  }

  // ink spray at the paint head
  if (!reduce && T > 0 && T < 1) {
    const idx = clamp(Math.round(T * 100), 0, 100), p = PTS[idx];
    const n = Math.random() < .7 ? 2 : 1;
    for (let i = 0; i < n; i++) ink.push({ x: p[0] + rnd(-.012, .012), y: p[1] + rnd(-.006, .006), vx: rnd(-.06, .06), vy: rnd(-.08, .02), r: rnd(.8, 2.4), life: 0 });
  }
  for (let i = ink.length - 1; i >= 0; i--) {
    const d = ink[i]; d.life += dt; d.vy += .12 * dt; d.x += d.vx * dt; d.y += d.vy * dt;
    const a = 1 - d.life / .7; if (a <= 0) { ink.splice(i, 1); continue; }
    ctx.fillStyle = `rgba(214,16,24,${a * .9})`;
    ctx.beginPath(); ctx.arc(d.x * SW, d.y * SH, d.r * SW / 450, 0, 7); ctx.fill();
  }
  requestAnimationFrame(tick);
}

function play() {
  phone.classList.remove("play", "done"); summit.classList.remove("on"); ring.classList.remove("on");
  stars.forEach(s => s.classList.remove("twinkle"));
  void phone.offsetWidth;
  phone.classList.add("play");
  t0 = 0; glinted = false; done = false; ink.length = 0;
}
phone.tabIndex = 0;
phone.addEventListener("click", play);
phone.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); play(); } });

// load, then start
const load = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
Promise.all([load(ROAD_SRC), load(DIST_SRC)]).then(([ri, di]) => {
  let ok = false;
  try { ok = initGL(ri, di); } catch (e) { ok = false; }
  if (!ok) {
    roadCv.style.display = "none"; gl = null;
    const fb = document.getElementById("roadFallback"); fb.width = ri.width; fb.height = ri.height; fb.style.display = "block";
    const c2 = fb.getContext("2d"); c2.drawImage(ri, 0, 0); const px = c2.getImageData(0, 0, ri.width, ri.height);
    const t = document.createElement("canvas"); t.width = di.width; t.height = di.height; const tc = t.getContext("2d"); tc.drawImage(di, 0, 0);
    const dp = tc.getImageData(0, 0, di.width, di.height).data;
    for (let i = 0; i < px.data.length; i += 4) px.data[i + 3] = dp[i + 2];
    c2.putImageData(px, 0, 0);
  }
  new ResizeObserver(size).observe(phone); size();
  play(); requestAnimationFrame(tick);
});
})();
</script>

</body>
</html>
